services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=devices'
      - 'POSTGRES_USER=devices'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      # Published on a random host port: spring-boot-docker-compose reads the mapping, so
      # nothing needs to know the number, and a Postgres already running on 5432 is no
      # longer a conflict. `docker compose port postgres 5432` prints the one in use.
      - '5432'
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devices -d devices']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

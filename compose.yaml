services:
  postgres:
    image: 'postgres:18'
    environment:
      - 'POSTGRES_DB=devices'
      - 'POSTGRES_USER=devices'
      - 'POSTGRES_PASSWORD=secret'
    ports:
      - "5432:5432"
    volumes:
      - 'postgres-data:/var/lib/postgresql'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devices -d devices']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
